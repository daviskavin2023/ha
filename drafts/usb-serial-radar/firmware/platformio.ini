; 待审草稿 — 不自动上传。espressif32@6.9.0 = Arduino-ESP32 2.x
; 物理芯片 ESP32-S3-N16R8（eFuse quad flash + 内置 8MB OPI PSRAM）
; 诊断结论：上一版用 qio_qspi + write --flash_mode qio，把 BL 头打成 QIO，
; ROM 加载第2段时 ets_loader.c 78。备份 ESPHome 与 PIO 产物头均为 DIO。
; 修正：dio_opi（Flash DIO + PSRAM OPI）+ 16MB；刷写须 --flash_mode dio。
; 刷写偏移：
;   bootloader.bin @ 0x0
;   partitions.bin @ 0x8000
;   boot_app0.bin  @ 0xe000
;   firmware.bin   @ 0x10000
[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_speed = 460800
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
