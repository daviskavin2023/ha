
- id: ha_watch_ld2410_ble_offline_reload_20261110
  alias: 监控：客厅LD2410蓝牙雷达掉线自动重载
  description: >-
    客厅LD2410蓝牙雷达(ld2410_ble / HLK-LD2410_63F5 / 3E:42:C4:93:63:F5,
    entry_id=01M70D66ZPDT04Q7W9T85A5N2J) 实体 unavailable 持续 2 分钟，
    或每 10 分钟巡检仍 unavailable 时，自动 reload 该集成条目。
    10 分钟冷却防狂重载（远距离扫不到时不每分钟刷客卫蓝牙代理）。
    无通知。2026-11-10 上线。
  triggers:
  - platform: state
    entity_id: binary_sensor.hlk_ld2410_63f5_occupancy
    to: unavailable
    for:
      minutes: 2
    id: unavailable_2min
  - platform: time_pattern
    minutes: /10
    id: periodic_10min
  conditions:
  - condition: state
    entity_id: binary_sensor.hlk_ld2410_63f5_occupancy
    state: unavailable
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() > 600 }}
  actions:
  - action: homeassistant.reload_config_entry
    target:
      entity_id: binary_sensor.hlk_ld2410_63f5_occupancy
  mode: single
  max_exceeded: silent
