esphome:
  name: wu-tai-radar
  friendly_name: "Stage Radar"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# C3 SuperMini 的 USB 是原生 USB Serial/JTAG，日志走 USB，
# UART0 (GPIO20/21) 全部留给 LD2410 雷达
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    ld2410: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: radar_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 256000
  rx_buffer_size: 512

ld2410:
  uart_id: radar_uart

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
      id: radar_presence
    has_moving_target:
      name: "Moving"
      id: radar_moving
    has_still_target:
      name: "Still"
      id: radar_still

sensor:
  - platform: ld2410
    detection_distance:
      name: "Detection Distance"
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    moving_energy:
      name: "Moving Energy"
    still_energy:
      name: "Still Energy"

number:
  - platform: ld2410
    timeout:
      name: "Timeout"
    max_move_distance_gate:
      name: "Max Move Distance Gate"
    max_still_distance_gate:
      name: "Max Still Distance Gate"

button:
  - platform: ld2410
    restart:
      name: "Radar Restart"
    query_params:
      name: "Radar Query"
