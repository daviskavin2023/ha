esphome:
  name: bathroom-climate
  friendly_name: "Bathroom Climate"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10.0dBm
  power_save_mode: LIGHT
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

sensor:
  - platform: wifi_signal
    name: "Bathroom WiFi Signal"
    update_interval: 10s

  - platform: sht3xd
    temperature:
      name: "Bathroom Temperature"
      id: bath_temp
      filters:
        - round: 1
        - or:
            - delta: 0.2
            - throttle: 60s
      on_value:
        then:
          - logger.log:
              level: DEBUG
              format: ">>> [实时 温度]: %.1f °C"
              args: [ 'x' ]
    humidity:
      name: "Bathroom Humidity"
      id: bath_humidity
      filters:
        - round: 1
        - or:
            - delta: 0.5
            - throttle: 60s
      on_value:
        then:
          - logger.log:
              level: DEBUG
              format: ">>> [实时 湿度]: %.1f %%"
              args: [ 'x' ]
    address: 0x44
    update_interval: 15s

  - platform: sgp4x
    voc_index:
      name: "Bathroom VOC Index"
      id: bath_voc
      filters:
        - or:
            - delta: 2
            - throttle: 60s
      on_value:
        then:
          - logger.log:
              level: DEBUG
              format: ">>> [实时 异味指数 VOC]: %.0f"
              args: [ 'x' ]
    address: 0x59
    compensation:
      temperature_source: bath_temp
      humidity_source: bath_humidity
    update_interval: 15s
