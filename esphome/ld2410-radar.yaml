esphome:
  name: ld2410-test
  friendly_name: "LD2410 Living Room Radar"
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - rtttl.play: "dingdong:d=4,o=5,b=120:e,c"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0
  logs:
    sensor: INFO
    binary_sensor: INFO
    ld2410: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: radar_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 256000
  rx_buffer_size: 512
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: radar_uart

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Moving"
    has_still_target:
      name: "Still"

sensor:
  - platform: ld2410
    detection_distance:
      name: "Detection Distance"
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    moving_energy:
      name: "Moving Energy"
    still_energy:
      name: "Still Energy"

number:
  - platform: ld2410
    timeout:
      name: "Timeout"
    max_move_distance_gate:
      name: "Max Move Distance Gate"
    max_still_distance_gate:
      name: "Max Still Distance Gate"

rtttl:
  id: my_rtttl
  speaker: my_speaker

button:
  - platform: ld2410
    restart:
      name: "Radar Restart"
    query_params:
      name: "Radar Query"
  - platform: restart
    name: "ESP32 Restart"
  - platform: template
    name: "Play Test Chime"
    id: play_test_chime
    on_press:
      - rtttl.play: "dingdong:d=4,o=5,b=120:e,c"
  - platform: template
    name: "Start Voice Listening"
    id: start_listening
    on_press:
      - voice_assistant.start:

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO15
  - id: i2s_in
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5

microphone:
  - platform: i2s_audio
    id: my_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO6
    adc_type: external
    pdm: false
    channel: left

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO16

voice_assistant:
  microphone: my_mic
  speaker: my_speaker

media_player:
  - platform: speaker
    name: "Xiaozhi Speaker"
    id: xiaozhi_speaker
    buffer_size: 32768
    announcement_pipeline:
      speaker: my_speaker
      format: NONE
