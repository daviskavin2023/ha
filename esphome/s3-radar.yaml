esphome:
  name: s3-radar
  friendly_name: "S3 Radar Sensor"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_80: "y"
      CONFIG_ESP_BROWNOUT_DET: "n"

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10.0dBm
  power_save_mode: LIGHT
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# 雷达 UART（先配置默认引脚，支持在页面配置）
uart:
  id: radar_uart
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 256000
  rx_buffer_size: 512

ld2410:
  uart_id: radar_uart

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
      id: radar_presence
    has_moving_target:
      name: "Moving"
      id: radar_moving
    has_still_target:
      name: "Still"
      id: radar_still

sensor:
  - platform: ld2410
    detection_distance:
      name: "Detection Distance"
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
