esphome:
  name: kitchen-sensor
  friendly_name: "Kitchen Sensor"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# C3 SuperMini 的 USB 是原生 USB Serial/JTAG，日志走 USB
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  logs:
    wifi: INFO
    api: INFO
    ota: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 8.5dBm
  post_connect_roaming: false
  enable_btm: false
  enable_rrm: false
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: false
  frequency: 100kHz
  timeout: 10ms

uart:
  id: radar_uart
  tx_pin: GPIO4
  rx_pin: GPIO3
  baud_rate: 256000
  rx_buffer_size: 512

ld2410:
  uart_id: radar_uart

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Kitchen Presence"
      id: kitchen_presence
    has_moving_target:
      name: "Kitchen Moving"
      id: kitchen_moving
    has_still_target:
      name: "Kitchen Still"
      id: kitchen_still

sensor:
  - platform: wifi_signal
    name: "Kitchen WiFi Signal"
    update_interval: 30s

  - platform: ld2410
    detection_distance:
      name: "Kitchen Detection Distance"
    moving_distance:
      name: "Kitchen Moving Distance"
    still_distance:
      name: "Kitchen Still Distance"

  - platform: sht3xd
    address: 0x44
    update_interval: 15s
    temperature:
      name: "Kitchen Temperature"
      id: kitchen_temp
      filters:
        - round: 1
        - or:
            - delta: 0.2
            - throttle: 60s
    humidity:
      name: "Kitchen Humidity"
      id: kitchen_humidity
      filters:
        - round: 1
        - or:
            - delta: 0.5
            - throttle: 60s

  - platform: sgp4x
    address: 0x59
    update_interval: 15s
    compensation:
      temperature_source: kitchen_temp
      humidity_source: kitchen_humidity
    voc_index:
      name: "Kitchen VOC Index"
      id: kitchen_voc
      filters:
        - or:
            - delta: 2
            - throttle: 60s

  - platform: bh1750
    name: "Kitchen Illuminance"
    id: kitchen_lux
    address: 0x23
    update_interval: 15s
